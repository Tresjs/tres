packages:
  - apps/*
  - packages/*
  - packages/*/playground
  - packages/*/playground/*
  - tools/*

minimumReleaseAge: 7200 # 5 days

# pnpm 11 no longer reads `shamefully-hoist` from .npmrc; it must live here.
shamefullyHoist: true

overrides:
