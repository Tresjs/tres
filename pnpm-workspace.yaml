  tmp: ^0.2.7 # GHSA-7c78-jf6q-g5cm: path traversal via non-string template in <=0.2.6
  'undici@7': ^7.29.1 # GHSA-3wwx-pv8p-q78v: DoS in permessage-deflate; miniflare pins 7.29.0

